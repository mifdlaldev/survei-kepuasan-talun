# Dependabot — update dependensi otomatis (npm)
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    versioning-strategy: "auto"
    ignore:
      # Jangan auto-update major wrangler/workerd — bisa patahkan binding
      - dependency-name: "wrangler"
        update-types: ["version-update:semver-major"]
